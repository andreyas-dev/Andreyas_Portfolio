<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Primary Cyan-Electric Blue Linear Gradient -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#00b8ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Metallic Dark Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#060b18" />
      <stop offset="100%" stop-color="#02050d" />
    </linearGradient>

    <!-- Glowing Accent Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Hexagonal Dark Precision Container with Chamfered Corners -->
  <path d="M 250,25 
           L 435,132 
           L 435,368 
           L 250,475 
           L 65,368 
           L 65,132 Z" 
        fill="url(#bgGradient)" 
        stroke="url(#techGradient)" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- 2. Inner Telemetry & Control System Grid Lines -->
  <!-- Outer Tech Ring -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.35"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>

  <!-- Precision Crosshair Ticks -->
  <line x1="250" y1="45" x2="250" y2="60" stroke="#00f3ff" stroke-width="3" opacity="0.7"/>
  <line x1="250" y1="440" x2="250" y2="455" stroke="#00f3ff" stroke-width="3" opacity="0.7"/>
  <line x1="45" y1="250" x2="60" y2="250" stroke="#00f3ff" stroke-width="3" opacity="0.7"/>
  <line x1="440" y1="250" x2="455" y2="250" stroke="#00f3ff" stroke-width="3" opacity="0.7"/>

  <!-- Corner Mechanical Notch Accents -->
  <circle cx="250" cy="25" r="4" fill="#00f3ff"/>
  <circle cx="435" cy="132" r="4" fill="#00f3ff"/>
  <circle cx="435" cy="368" r="4" fill="#00f3ff"/>
  <circle cx="250" cy="475" r="4" fill="#00f3ff"/>
  <circle cx="65" cy="368" r="4" fill="#00f3ff"/>
  <circle cx="65" cy="132" r="4" fill="#00f3ff"/>

  <!-- 3. Central Engineering Monogram 'A' (Mechatronics & Control Loop Geometry) -->
  <g filter="url(#subtleGlow)">
    <!-- Main Left Apex Wing of 'A' -->
    <path d="M 250,95 L 140,360 L 180,360 L 250,185 L 320,360 L 360,360 Z" fill="url(#techGradient)"/>

    <!-- Inner Core Cutout for Sharp Geometry -->
    <path d="M 250,140 L 195,290 L 305,290 Z" fill="#060b18"/>

    <!-- Horizontal Robotic Arm / Control Loop Bridge -->
    <rect x="155" y="270" width="190" height="24" rx="4" fill="url(#techGradient)" />

    <!-- Central Micro-Controller Core Junction (Diamond Node) -->
    <polygon points="250,242 270,282 250,322 230,282" fill="#060b18" stroke="#00f3ff" stroke-width="3"/>
    <circle cx="250" cy="282" r="7" fill="#00f3ff" filter="url(#neonGlow)"/>

    <!-- Integrated PCB Circuit Traces & Control Feedback Loops -->
    <!-- Left Branch Trace -->
    <path d="M 155,282 L 105,282 L 85,320" fill="none" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="85" cy="320" r="5.5" fill="#00f3ff"/>

    <!-- Right Branch Trace -->
    <path d="M 345,282 L 395,282 L 415,320" fill="none" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="415" cy="320" r="5.5" fill="#00f3ff"/>

    <!-- Top Apex Feedback Node -->
    <line x1="250" y1="95" x2="250" y2="60" stroke="#00f3ff" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="250" cy="95" r="6" fill="#00f3ff" stroke="#060b18" stroke-width="2"/>
    <circle cx="250" cy="60" r="4" fill="#00f3ff"/>
  </g>
</svg>
